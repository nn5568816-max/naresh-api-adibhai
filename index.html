<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Search Portal</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
    input, button { padding: 10px; margin-top: 10px; width: 100%; box-sizing: border-box; }
    pre { background: #f4f4f4; padding: 15px; border-radius: 5px; overflow-x: auto; }
  </style>
</head>
<body>
  <h2>User Info API Search</h2>
  <input type="text" id="key" placeholder="Enter API Key (e.g., ADITYA-123)" />
  <input type="text" id="number" placeholder="Enter Phone Number" />
  <button onclick="fetchDetails()">Get Details</button>

  <h3>API Output:</h3>
  <pre id="output">Results will appear here...</pre>

  <script>
    async function fetchDetails() {
      const key = document.getElementById('key').value;
      const number = document.getElementById('number').value;
      const output = document.getElementById('output');

      if (!key || !number) {
        alert("Please enter both API key and Mobile Number.");
        return;
      }

      output.textContent = "Fetching data...";

      try {
        const res = await fetch(`/api/number?key=${encodeURIComponent(key)}&number=${encodeURIComponent(number)}`);
        const data = await res.json();
        output.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        output.textContent = "Error fetching API response.";
      }
    }
  </script>
</body>
</html>
